name: Build Universal Windows Desktop EXE (Portable & Installer)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. استخراج ملفات المشروع في حال تم رفع المشروع كملف ZIP
      - name: Unzip Project Files
        shell: bash
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "[UNZIP] Found zip archive, extracting..."
            unzip *.zip -d temp_unzip || true
            TARGET_DIR=$(find temp_unzip -name "package.json" -exec dirname {} \;)
            if [ -n "$TARGET_DIR" ]; then
              echo "[UNZIP] Found project files in: $TARGET_DIR"
              cp -r $TARGET_DIR/* .
            fi
            rm -rf temp_unzip
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 2. إعداد بايثون لتشفير التوكن العسكري تلقائياً (متوافق مع ترميز ويندوز)
      - name: Set up Python for Encryption
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Smart Encrypt & Inject Database Credentials
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
          RAW_TURSO_URL: ${{ secrets.TURSO_URL || '' }}
          RAW_TURSO_TOKEN: ${{ secrets.TURSO_TOKEN || '' }}
        run: |
          python -c "
          import os, sys, re, json

          if sys.stdout.encoding != 'utf-8':
              try:
                  sys.stdout.reconfigure(encoding='utf-8')
              except:
                  pass

          raw_url = os.environ.get('RAW_TURSO_URL', '').strip()
          raw_token = os.environ.get('RAW_TURSO_TOKEN', '').strip()

          aldion_path = 'aldion.ts'
          if not os.path.exists(aldion_path):
              aldion_path = 'src/aldion.ts'

          if raw_url and raw_token:
              print('[ENCRYPT] Jari tashfeer al-token wa al-rabit...')
              url_key = [83, 183, 31, 140, 66, 158, 97, 170, 53, 212]
              token_key = [155, 77, 226, 26, 119, 60, 245, 134, 41, 161, 100, 216]

              def encrypt_bytes(text, key, salt=7):
                  return [(ord(c) ^ key[i % len(key)] ^ ((i * salt) & 0xFF)) & 0xFF for i, c in enumerate(text)]

              enc_url_bytes = encrypt_bytes(raw_url, url_key)
              enc_token_bytes = encrypt_bytes(raw_token, token_key)

              if os.path.exists(aldion_path):
                  with open(aldion_path, 'r', encoding='utf-8') as f:
                      content = f.read()

                  content = re.sub(
                      r'const _CIPHER_TOKEN_BYTES:\s*number\[\]\s*=\s*\[[\s\S]*?\];',
                      f'const _CIPHER_TOKEN_BYTES: number[] = {json.dumps(enc_token_bytes)};',
                      content
                  )
                  content = re.sub(
                      r'const _CIPHER_URL_BYTES:\s*number\[\]\s*=\s*\[[\s\S]*?\];',
                      f'const _CIPHER_URL_BYTES: number[] = {json.dumps(enc_url_bytes)};',
                      content
                  )
                  content = re.sub(r'export const MANUAL_OVERRIDE_TURSO_URL:\s*string\s*=\s*[\"|\'].*?[\"|\'];', 'export const MANUAL_OVERRIDE_TURSO_URL: string = \"\";', content)
                  content = re.sub(r'export const MANUAL_OVERRIDE_TURSO_TOKEN:\s*string\s*=\s*[\"|\'].*?[\"|\'];', 'export const MANUAL_OVERRIDE_TURSO_TOKEN: string = \"\";', content)

                  with open(aldion_path, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print('[SUCCESS] Database credentials encrypted successfully.')
              else:
                  print('[WARNING] aldion.ts not found.')
          else:
              print('[INFO] Using existing credentials from project files.')
          "

      # 3. تثبيت النسخة الخاصة الداعمة لويندوز 7 و 8 والأنوية المزدوجة (32bit & 64bit)
      - name: Install Universal Dependencies
        shell: bash
        run: |
          npm install --force
          npm install --save-dev electron@22.3.27 electron-builder@latest

      - name: Build Web Application
        shell: bash
        run: npm run build

      # 4. إنشاء ملف تشغيل CJS خفيف متوافق مع كافة أنظمة الويندوز
      - name: Create CJS Entry Point
        shell: bash
        run: |
          cat << 'EOF' > main.cjs
          const { app, BrowserWindow, Menu } = require('electron');
          const path = require('path');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 850,
              minWidth: 950,
              minHeight: 650,
              title: "دفتر الديون - نظام إدارة الحسابات",
              icon: path.join(__dirname, 'dist', 'icon.png'),
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true
              }
            });

            Menu.setApplicationMenu(null);
            win.loadFile(path.join(__dirname, 'dist', 'index.html'));
          }

          app.whenReady().then(createWindow);

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          EOF

      # 5. معالجة package.json وتوليد النسخة المحمولة + نسخة التثبيت
      - name: Configure Package and Build Universal Portable & Setup EXE
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            
            // إلغاء type module وتحديد ملف التشغيل لمنع ERR_REQUIRE_ESM
            pkg.main = "main.cjs";
            delete pkg.type;

            pkg.build = {
              appId: "com.daftar.aldeyon",
              productName: "دفتر الديون",
              directories: { output: "dist_electron" },
              files: ["dist/**/*", "main.cjs"],
              win: {
                target: [
                  { target: "portable", arch: ["x64", "ia32"] }, // النسخة المحمولة (بدون تثبيت)
                  { target: "nsis", arch: ["x64", "ia32"] }     // نسخة التثبيت التقليدية
                ]
              },
              portable: {
                artifactName: "Daftar-Aldeyon-Portable-${arch}.exe"
              },
              nsis: {
                oneClick: false,
                allowToChangeInstallationDirectory: true,
                createDesktopShortcut: true,
                shortcutName: "دفتر الديون",
                artifactName: "Daftar-Aldeyon-Setup-${arch}.exe"
              }
            };
            
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          
          npx electron-builder --win portable nsis --x64 --ia32 --config.extraMetadata.main=main.cjs --publish never

      # 6. رفع النسختين النهائية (المرنة المحمولة + التثبيت) للتنزيل الفوري
      - name: Upload Portable & Setup Windows EXEs
        uses: actions/upload-artifact@v4
        with:
          name: Daftar-Aldeyon-Windows-EXEs
          path: dist_electron/*.exe
